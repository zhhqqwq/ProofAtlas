schema_version: 1.0-rc1
graph: {id: G_reciprocal_continuity, title: Continuity of 1/x at a != 0, status: validated, root_scope: S_proof}
entities:
- {id: E_a, kind: MathematicalEntity, home_scope: S_proof, canonical_label: a, math_kind_hint: scalar, origin_mode: inherited}
- {id: E_eps, kind: MathematicalEntity, home_scope: S_proof, canonical_label: epsilon, math_kind_hint: scalar, origin_mode: inherited}
- {id: E_half, kind: MathematicalEntity, home_scope: S_proof, canonical_label: 1/2, math_kind_hint: scalar, origin_mode: inherited}
- {id: E_delta, kind: MathematicalEntity, home_scope: S_route, canonical_label: delta, math_kind_hint: parameter, origin_mode: chosen}
- id: F_theta
  kind: SearchSpace
  home_scope: S_route
  canonical_label: theta in (0,1)
  process_profile: {search_space_kind: parameter_family, constraint: 0<theta<1}
- {id: U_denom, kind: Unit, home_scope: S_route, canonical_label: protect denominator away from zero}
- {id: U_thresh, kind: Unit, home_scope: S_route, canonical_label: synthesize reciprocal threshold}
- {id: C_goal, kind: Claim, home_scope: S_route, canonical_label: epsilon-delta goal, proposition_text: "|x-a|<delta implies |1/x-1/a|<epsilon", references: [E_a,E_delta,E_eps], claim_status: goal}
- {id: C_loc, kind: Claim, home_scope: S_route, canonical_label: denominator localization, proposition_text: "|x-a|<|a|/2", references: [E_a,E_half], claim_status: required}
- {id: C_lower, kind: Claim, home_scope: S_route, canonical_label: denominator lower bound, proposition_text: "|x|>|a|/2", references: [E_a,E_half], claim_status: proved}
- {id: C_err, kind: Claim, home_scope: S_route, canonical_label: error constraint, proposition_text: "|x-a|<epsilon|a|^2/2", references: [E_a,E_eps,E_half], claim_status: candidate_requirement}
- {id: C_delta, kind: Claim, home_scope: S_route, canonical_label: merged delta, proposition_text: "delta=min{|a|/2, epsilon|a|^2/2}", references: [E_delta,E_a,E_eps,E_half], claim_status: proved}
- id: P_delta
  kind: PresentationSpan
  home_scope: S_route
  canonical_label: announce reciprocal delta
  presentation_profile: {text: "Take δ=min{|a|/2, ε|a|^2/2}.", document_id: reciprocal-continuity-proof}
- id: P_bound
  kind: PresentationSpan
  home_scope: S_route
  canonical_label: denominator bound
  presentation_profile: {text: "Then |x|>|a|/2, hence |1/x-1/a|<ε.", document_id: reciprocal-continuity-proof}
scopes:
- {id: S_proof, kind: proof, status: active}
- {id: S_route, kind: route, parent_scope: S_proof, status: active, local_bindings: [E_delta,F_theta,U_denom,U_thresh,C_goal,C_loc,C_lower,C_err,C_delta]}
relations:
- id: R_goal
  semantic_mode: assertion
  layer: search
  relation_type: goal_of
  participants: [{role: goal, ref: C_goal},{role: process, ref: U_denom}]
  scope: S_route
  evidence: {kind: structural_reconstruction}
  confidence: strong
- id: R_half_member
  semantic_mode: assertion
  layer: search
  relation_type: candidate_in
  participants: [{role: candidate, ref: E_half},{role: search_space, ref: F_theta}]
  scope: S_route
  evidence: {kind: structural_reconstruction}
  confidence: strong
- id: R_select_half
  semantic_mode: event
  layer: search
  relation_type: select
  participants: [{role: selector, ref: U_denom},{role: search_space, ref: F_theta},{role: selected, ref: E_half}]
  scope: S_route
  evidence: {kind: m3_forward_reconstruction}
  confidence: strong
  fidelity: M3-provisional
  event: {outputs: [E_half], causal_parents: [], outcome: accepted}
  provenance:
    kind: constant
    parents: [F_theta]
    origin_mode: chosen
    value_necessity: not_necessary
    role_necessity: necessary
    route_necessity: necessary
    optimality: nonoptimal_but_simple
    alternatives: ["any theta in (0,1)"]
- id: R_loc
  semantic_mode: event
  layer: logical
  relation_type: establish_claim
  participants: [{role: actor, ref: U_denom},{role: evidence, ref: R_select_half},{role: conclusion, ref: C_loc}]
  scope: S_route
  evidence: {kind: mathematical_derivation}
  confidence: certain
  event: {outputs: [C_loc], causal_parents: [R_select_half], outcome: established}
- id: R_lower
  semantic_mode: event
  layer: logical
  relation_type: establish_claim
  participants: [{role: actor, ref: U_denom},{role: evidence, ref: C_loc},{role: conclusion, ref: C_lower}]
  scope: S_route
  evidence: {kind: mathematical_derivation}
  confidence: certain
  event: {preconditions: [C_loc], outputs: [C_lower], causal_parents: [R_loc], outcome: proved}
- id: R_err
  semantic_mode: event
  layer: search
  relation_type: produce
  participants: [{role: producer, ref: U_thresh},{role: output, ref: C_err}]
  scope: S_route
  evidence: {kind: structural_reconstruction}
  confidence: strong
  event: {preconditions: [C_lower], outputs: [C_err], causal_parents: [R_lower], outcome: constraint_synthesized}
  provenance: {kind: constant, parents: [C_lower,E_eps], origin_mode: derived, role_necessity: necessary, route_necessity: necessary, optimality: not_applicable}
- id: R_merge
  semantic_mode: event
  layer: search
  relation_type: merge
  participants: [{role: input, ref: C_loc},{role: input, ref: C_err},{role: output, ref: C_delta}]
  scope: S_route
  evidence: {kind: constraint_provenance}
  confidence: strong
  event: {preconditions: [C_loc,C_err], outputs: [C_delta], causal_parents: [R_loc,R_err], outcome: merged}
  provenance: {kind: mixed, parents: [C_loc,C_err], origin_mode: derived, role_necessity: necessary, route_necessity: necessary}
- id: R_final
  semantic_mode: event
  layer: logical
  relation_type: establish_claim
  participants: [{role: actor, ref: U_thresh},{role: evidence, ref: C_delta},{role: evidence, ref: C_lower},{role: conclusion, ref: C_goal}]
  scope: S_route
  evidence: {kind: mathematical_derivation}
  confidence: certain
  event: {preconditions: [C_delta,C_lower], outputs: [C_goal], causal_parents: [R_merge,R_lower], outcome: proved}
- id: R_delta_map
  semantic_mode: assertion
  layer: cross_layer
  relation_type: compressed_into
  participants: [{role: source, ref: R_select_half},{role: source, ref: R_err},{role: source, ref: R_merge},{role: target, ref: P_delta}]
  scope: S_route
  evidence: {kind: explicit_text}
  confidence: strong
  loss_profile: [motivation_loss,constant_provenance_loss,constraint_provenance_loss]
- id: R_bound_map
  semantic_mode: assertion
  layer: cross_layer
  relation_type: presented_as
  participants: [{role: source, ref: R_lower},{role: source, ref: R_final},{role: target, ref: P_bound}]
  scope: S_route
  evidence: {kind: explicit_text}
  confidence: certain
mentions:
- {id: M_half_loc, entity_id: E_half, scope: S_route, view: presentation, source_span: P_delta, surface_form: 1/2, role_in_span: localization factor}
- {id: M_half_err, entity_id: E_half, scope: S_route, view: presentation, source_span: P_delta, surface_form: 1/2, role_in_span: error-threshold factor}
- {id: M_delta, entity_id: E_delta, scope: S_route, view: presentation, source_span: P_delta, surface_form: δ}
relation_signatures: {catalog_version: 1.0-rc1}
presentation_sequences:
- {id: SEQ_recip, document_id: reciprocal-continuity-proof, ordered_spans: [P_delta,P_bound]}
validation_invariants: [stress-tested]
